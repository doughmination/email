name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Builds from main replace the same release, so let them finish in order.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The keystore is stored base64-encoded in secrets. Pull requests from
      # forks don't get secrets, so they build unsigned.
      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > inbox.jks
          printf 'storeFile=inbox.jks\nstorePassword=%s\nkeyAlias=inbox\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk)
          mv "$src" inbox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: inbox-apk
          path: inbox.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" inbox.apk --generate-notes

      # A rolling "latest" release that always holds the newest build from main,
      # so releases/download/latest/inbox.apk is a link that never changes.
      - name: Publish rolling latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest inbox.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ($VERSION_NAME)" \
            --notes "Built from ${GITHUB_SHA::7} on main. Installs over any earlier build." \
            --latest
