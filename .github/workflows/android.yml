name: Build APK

# Only changes under app/ rebuild the APK; tags always do.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Builds from main replace the same release, so let them finish in order.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Releases must be signed with the app's key, or they can't install over
      # earlier builds; say so rather than quietly skipping the release.
      - name: Require signing key
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASSWORD aren't set on this repository, so no release can be built. See app/README.md (CI)."
          exit 1

      # The keystore is stored base64-encoded in secrets. Pull requests from
      # forks don't get secrets, so they build unsigned.
      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > inbox.jks
          printf 'storeFile=inbox.jks\nstorePassword=%s\nkeyAlias=inbox\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      # Notifications need the Firebase config. Commit app/app/google-services.json
      # (it isn't secret) or store it base64'd in this secret; without either the
      # APK builds with notifications off.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # Tags are named by version (v1.2.0 builds 1.2.0); everything else is 1.0.<run>.
      - name: Version
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version=${TAG#v}
          echo "VERSION_NAME=${version:-1.0.$GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk)
          mv "$src" "inbox-$VERSION_NAME.apk"
          echo "APK=inbox-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: inbox-${{ env.VERSION_NAME }}
          path: app/${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --generate-notes

      # A rolling "latest" release that always holds the newest build from main.
      # The site's /download link redirects to its APK, whatever it's named.
      - name: Publish rolling latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$APK" \
            --target "$GITHUB_SHA" \
            --title "Latest build ($VERSION_NAME)" \
            --notes "Built from ${GITHUB_SHA::7} on main. Installs over any earlier build." \
            --latest
