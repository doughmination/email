    <!-- Splash: inline so it paints before the bundle loads. The same as the
         Android app's: the mascot flies up into its disc while the envelope
         drops onto its string, hovers until mail is in, then lifts away. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0b0a0d;
      }

      #splash .disc {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: #f1e4ea;
      }

      #splash svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #splash * {
        transform-box: view-box;
      }

      #splash .m {
        transform-origin: 260px 268px;
        animation:
          splash-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both,
          splash-bob 1.4s ease-in-out 0.9s infinite;
      }

      #splash .wing-l {
        transform-origin: 140px 228px;
        animation:
          splash-flap-l 0.3s ease-in-out 3,
          splash-flap-l 0.7s ease-in-out 0.9s infinite;
      }

      #splash .wing-r {
        transform-origin: 372px 228px;
        animation:
          splash-flap-r 0.3s ease-in-out 3,
          splash-flap-r 0.7s ease-in-out 0.9s infinite;
      }

      #splash .env {
        transform-origin: 256px 300px;
        animation:
          splash-drop 0.8s cubic-bezier(0.3, 1.5, 0.5, 1) 0.35s both,
          splash-swing 1.4s linear 1.15s infinite;
      }

      #splash.out {
        animation: splash-lift 0.45s cubic-bezier(0.5, 0, 0.75, 0) forwards;
        pointer-events: none;
      }

      @keyframes splash-rise {
        from {
          transform: translateY(70px);
          opacity: 0;
        }
      }

      @keyframes splash-bob {
        50% {
          transform: translateY(-14px);
        }
      }

      @keyframes splash-flap-l {
        50% {
          transform: rotate(-24deg) scaleX(0.85);
        }
      }

      @keyframes splash-flap-r {
        50% {
          transform: rotate(24deg) scaleX(0.85);
        }
      }

      @keyframes splash-drop {
        from {
          transform: translateY(-170px) scale(0.6);
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
      }

      @keyframes splash-swing {
        0%,
        100% {
          transform: rotate(0);
        }
        25% {
          transform: rotate(7deg);
        }
        75% {
          transform: rotate(-7deg);
        }
      }

      @keyframes splash-lift {
        to {
          transform: translateY(-100%);
        }
      }

      @keyframes splash-fade {
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }

        #splash.out {
          animation-name: splash-fade;
        }
      }
    </style>
